name: RPG Maker Daily Report

on:
  workflow_dispatch:

  schedule:
    # 日本時間 6:00
    - cron: '0 21 * * *'

    # 日本時間 18:00
    - cron: '0 9 * * *'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEVIANTART_CLIENT_ID: ${{ secrets.DEVIANTART_CLIENT_ID }}
          DEVIANTART_CLIENT_SECRET: ${{ secrets.DEVIANTART_CLIENT_SECRET }}
        run: python main.py

      - name: Commit seen files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen.json
          git add seen_official.json

          git diff --cached --quiet || git commit -m "Update seen files"

          git push
