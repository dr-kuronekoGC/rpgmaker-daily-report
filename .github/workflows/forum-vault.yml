name: RPG Maker Forum Vault

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forum-vault:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run Forum Vault
        run: python forum_vault.py

      - name: Show vault files
        if: always()
        run: |
          echo "=== Forum Vault ==="
          ls -lah data/forum_vault || true

          echo ""
          echo "=== Progress ==="
          if [ -f forum_vault_progress.json ]; then
            cat forum_vault_progress.json
          else
            echo "forum_vault_progress.json not found"
          fi

      - name: Commit Forum Vault data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/forum_vault
          git add forum_vault_progress.json

          git diff --cached --quiet || git commit -m "Update Forum Vault"

          git push
