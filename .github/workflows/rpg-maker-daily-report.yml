name: RPG Maker Daily Report

on:
  workflow_dispatch:

  schedule:
    # 日本時間 6:00
    - cron: '15 21 * * *'

    # 日本時間 18:00
    - cron: '15 9 * * *'

permissions:
  contents: write

# PRE-ID allocation and review queue updates must not run concurrently.
concurrency:
  group: rpg-maker-daily-report-main
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEVIANTART_CLIENT_ID: ${{ secrets.DEVIANTART_CLIENT_ID }}
          DEVIANTART_CLIENT_SECRET: ${{ secrets.DEVIANTART_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py

      - name: Commit seen files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 全collectorのseenを保存する。\n          # 新しいサイト追加時のgit add漏れで、毎回同じ項目を\n          # 「新着」として再検出することを防ぐ。\n          git add 'seen_*.json'\n          git add pending_items.json
          git add data/archive
          git add data/review

          git diff --cached --quiet || git commit -m "Update report data"

          git push
