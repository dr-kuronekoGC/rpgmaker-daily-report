name: Canonical Item model tests

on:
  pull_request:
    paths:
      - "data/schema/item_schema.json"
      - "item_model.py"
      - "asset_metadata.py"
      - "asset_metadata_fields.py"
      - "asset_metadata_engine.py"
      - "categories/display.py"
      - "report_formatters.py"
      - "sources/official_deviantart.py"
      - "tools/test_canonical_item_model.py"
      - "tools/test_asset_metadata_refactor.py"
      - "tools/test_searchable_asset_metadata.py"
      - "tools/test_resource_intent.py"
      - ".github/workflows/test-item-model.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate changed module syntax
        run: python -m py_compile item_model.py asset_metadata.py categories/display.py report_formatters.py sources/official_deviantart.py

      - name: Run canonical model and regression tests
        env:
          PYTHONPATH: tools:.
        run: python -m unittest tools/test_canonical_item_model.py tools/test_asset_metadata_refactor.py tools/test_searchable_asset_metadata.py tools/test_resource_intent.py
