name: Auto-screen triage tests

on:
  pull_request:
    paths:
      - "tools/auto_screen_open_reviews.py"
      - "tools/fetch_historical_review_bodies.py"
      - "tools/test_auto_screen_triage.py"
      - ".github/workflows/test-auto-screen-triage.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate screening script syntax
        run: python -m py_compile tools/auto_screen_open_reviews.py tools/fetch_historical_review_bodies.py asset_metadata_intent.py

      - name: Run triage safety tests
        env:
          PYTHONPATH: tools:.
        run: python -m unittest tools/test_auto_screen_triage.py
