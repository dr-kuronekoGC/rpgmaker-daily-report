name: Reset Seen

on:
  workflow_dispatch:
  workflow_call:

jobs:
  reset-seen:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reset seen files
        run: |
          echo "[]" > seen.json
          echo "[]" > seen_deviantart.json
          echo "[]" > seen_global.json
          echo "[]" > seen_official.json
          echo "[]" > official_seen.json
          echo "[]" > pending_items.json
          echo "[]" > seen_forum.json
          echo "[]" > seen_tsukumate.json
          echo "[]" > seen_tsukupura.json
          echo "[]" > seen_tkool_forum.json
          echo "[]" > seen_save_point.json
          echo "{}" > seen_source_check.json
          echo "[]" > seen_guild.json
          echo "{}" > seen_triacontane.json

      - name: Commit reset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            seen.json \
            seen_deviantart.json \
            seen_global.json \
            seen_official.json \
            official_seen.json \
            pending_items.json \
            seen_forum.json \
            seen_tsukumate.json \
            seen_tsukupura.json \
            seen_tkool_forum.json \
            seen_save_point.json \
            seen_source_check.json \
            seen_guild.json \
            seen_triacontane.json

          git diff --cached --quiet || \
            git commit -m "Reset seen history"

          git push
