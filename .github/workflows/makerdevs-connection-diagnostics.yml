name: Maker Devs Connection Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/diagnose_makerdevs_connection.py"
      - ".github/workflows/makerdevs-connection-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Diagnose Maker Devs DNS, TCP, TLS, and HTTP
        run: python tools/diagnose_makerdevs_connection.py
