name: Source Connection Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/diagnose_makerdevs_connection.py"
      - ".github/workflows/makerdevs-connection-diagnostics.yml"
  pull_request:
    paths:
      - "tools/diagnose_makerdevs_connection.py"
      - ".github/workflows/makerdevs-connection-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Diagnose paused Source Check sites and public feed
        run: python tools/diagnose_makerdevs_connection.py
