name: Auto-screen Open Review Items

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/auto_screen_open_reviews.py"
      - "tools/fetch_historical_review_bodies.py"
      - "asset_metadata_intent.py"
      - ".github/workflows/auto-screen-open-reviews.yml"

permissions:
  contents: write

# Serialize review-ledger updates with the daily report and other audit workflows.
concurrency:
  group: rpg-maker-daily-report-main
  cancel-in-progress: false

jobs:
  auto-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate screening script syntax
        run: python -m py_compile tools/auto_screen_open_reviews.py tools/fetch_historical_review_bodies.py asset_metadata_intent.py

      - name: Test resource evidence and safety rules
        env:
          PYTHONPATH: tools:.
        run: python -m unittest tools/test_auto_screen_triage.py tools/test_fetch_historical_review_bodies.py

      - name: Check open review items and resolve only high-confidence exclusions
        env:
          PYTHONPATH: .
        run: python tools/auto_screen_open_reviews.py

      - name: Commit high-confidence resolutions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review/classification_review.json data/review/auto_screen_log.json data/review/auto_screen_audit.json
          if git diff --cached --quiet; then
            echo "No high-confidence review resolutions to commit."
          else
            git commit -m "Auto-screen clearly unavailable review items"
            git push
          fi
