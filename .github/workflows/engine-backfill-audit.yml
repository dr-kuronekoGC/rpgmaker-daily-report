name: Engine Backfill Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "asset_metadata.py"
      - "data/archive/**"
      - "tools/audit_engine_backfill.py"
      - "tools/backfill_engine_metadata.py"
      - "tools/test_engine_backfill_audit.py"
      - "tools/test_backfill_engine_metadata.py"
      - "tools/prepare_engine_backfill_pr.py"
      - "tools/test_prepare_engine_backfill_pr.py"
      - ".github/workflows/prepare-engine-backfill-pr.yml"
      - ".github/workflows/engine-backfill-audit.yml"
  push:
    branches: [main]
    paths:
      - "asset_metadata.py"
      - "data/archive/**"
      - "tools/audit_engine_backfill.py"
      - "tools/backfill_engine_metadata.py"
      - "tools/test_engine_backfill_audit.py"
      - "tools/test_backfill_engine_metadata.py"
      - ".github/workflows/engine-backfill-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Test engine audit and backfill preview
        run: |
          python -m unittest tools.test_engine_backfill_audit -v
          python -m unittest tools.test_backfill_engine_metadata -v
          python -m unittest tools.test_prepare_engine_backfill_pr -v

      - name: Audit historical archives without modifying them
        env:
          PYTHONPATH: .
        run: python tools/audit_engine_backfill.py

      - name: Generate safe backfill preview copies
        env:
          PYTHONPATH: .
        run: python tools/backfill_engine_metadata.py

      - name: Upload engine audit and backfill preview
        uses: actions/upload-artifact@v4
        with:
          name: engine-backfill-preview
          path: |
            engine_backfill_audit.json
            engine_backfill_preview/
          if-no-files-found: error
