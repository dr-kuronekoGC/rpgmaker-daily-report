name: Reset Sites

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Reset mode: archive keeps a backup; complete removes all SITE data"
        required: true
        default: "archive"
        type: choice
        options:
          - archive
          - complete

  workflow_call:
    inputs:
      mode:
        description: "Reset mode: archive keeps a backup; complete removes all SITE data"
        required: true
        type: string

jobs:
  reset-sites:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reset SITE data
        env:
          RESET_MODE: ${{ inputs.mode }}
        run: |
          if [ "$RESET_MODE" = "complete" ]; then
            echo "COMPLETE RESET: removing all SITE data."
            rm -rf data/sites
            mkdir -p data/sites
          else
            echo "ARCHIVE RESET: backing up current SITE master before reset."
            mkdir -p data/sites/reset_archive
            if [ -f data/sites/sites.json ]; then
              stamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)
              cp data/sites/sites.json "data/sites/reset_archive/sites-$stamp.json"
            fi
          fi

          printf '[]\n' > data/sites/sites.json

      - name: Commit reset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/sites

          git diff --cached --quiet || \
            git commit -m "Reset SITE data"

          git push
