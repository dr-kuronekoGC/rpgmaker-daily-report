name: Review Link Audit

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rpg-maker-daily-report-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit links and resolve confirmed dead links
        run: python tools/audit_review_links.py --apply-dead-links
      - name: Commit audit and exclusion results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/review/classification_review.json data/review/review_decisions.json review_link_audit.json
          git diff --cached --quiet || git commit -m "Audit review links and exclude confirmed dead links"
          git push
      - name: Upload review link audit
        uses: actions/upload-artifact@v4
        with:
          name: review-link-audit
          path: review_link_audit.json
          if-no-files-found: error
