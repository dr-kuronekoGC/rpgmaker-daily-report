name: Review Link Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Audit open review links (read-only)
        run: python tools/audit_review_links.py
      - name: Upload review link audit
        uses: actions/upload-artifact@v4
        with:
          name: review-link-audit
          path: review_link_audit.json
          if-no-files-found: error
